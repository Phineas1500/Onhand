<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Onhand Microphone Permission</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f2e9de;
				color: #575279;
				font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			main {
				width: min(520px, calc(100vw - 40px));
				background: #fffaf3;
				border: 1px solid #dfdad9;
				border-radius: 8px;
				padding: 24px;
				box-shadow: 0 12px 34px rgb(87 82 121 / 12%);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 22px;
			}
			p {
				margin: 0 0 16px;
			}
			button {
				border: 0;
				border-radius: 4px;
				background: #286983;
				color: #fffaf3;
				font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				padding: 10px 14px;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.6;
				cursor: wait;
			}
			#status {
				margin-top: 16px;
				color: #797593;
			}
			#status.error {
				color: #b4637a;
			}
			#status.ok {
				color: #56949f;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Allow Microphone For Onhand</h1>
			<p>Chrome sometimes cannot grant microphone access directly from the side panel. This page grants it to the Onhand extension.</p>
			<button id="allowButton" type="button">Allow microphone</button>
			<div id="status">Click the button and accept Chrome's microphone prompt.</div>
		</main>
		<script src="mic-permission.js"></script>
	</body>
</html>
