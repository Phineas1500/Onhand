<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Open Onhand in Opera</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: #161421;
				color: #f4f1ff;
			}

			body {
				box-sizing: border-box;
				width: 286px;
				margin: 0;
				padding: 14px;
				background: #161421;
			}

			.header {
				display: flex;
				align-items: center;
				gap: 9px;
				margin-bottom: 9px;
				font-size: 14px;
				font-weight: 700;
			}

			.header img {
				width: 22px;
				height: 22px;
			}

			p {
				margin: 0;
				color: #d9d2ec;
				font-size: 13px;
				line-height: 1.45;
			}

			.hint {
				margin-top: 10px;
				padding-top: 10px;
				border-top: 1px solid #312b45;
				color: #aba1c7;
				font-size: 12px;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<img src="icons/onhand-32.png" alt="" />
			<span>Open Onhand from Opera</span>
		</div>
		<p>Use the Onhand button in Opera's left sidebar to open the native sidebar panel.</p>
		<p class="hint">If it is hidden, open Sidebar setup and enable Onhand.</p>
	</body>
</html>
