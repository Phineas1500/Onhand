# Relay for the Onhand connector (prototype). It runs no model and holds no
# key: a chat site's servers call /mcp/<pairing code>, and the relay passes
# each tool call to that person's Onhand extension over the WebSocket the
# extension opened at /socket/<pairing code>. Page text passes through in
# memory and is never stored or logged.
name = "onhand-connector"
main = "src/index.mjs"
compatibility_date = "2026-05-01"
# Answers only on Onhand's own domain. The account's workers.dev address and
# the per-version preview addresses are off, so the link a person pastes into
# a chat site names Onhand and nothing else.
workers_dev = false
preview_urls = false
routes = [{ pattern = "connect.useonhand.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "CONNECTOR_RELAY"
class_name = "ConnectorRelay"

[[migrations]]
tag = "v1-connector-relay"
new_sqlite_classes = ["ConnectorRelay"]

[observability]
enabled = false
