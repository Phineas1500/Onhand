name = "onhand-free-tier"
main = "src/worker.mjs"
compatibility_date = "2026-05-01"
compatibility_flags = ["enable_request_signal"]

# Create with: npx wrangler kv namespace create FREE_TIER_KV
# then paste the returned id below before deploying.
[[kv_namespaces]]
binding = "FREE_TIER_KV"
id = "7b951e234331464bb18b2d62c2d80266"

[[durable_objects.bindings]]
name = "FREE_TIER_COST_LEDGER"
class_name = "FreeTierCostLedger"

[[migrations]]
tag = "v1-daily-cost-ledger"
new_sqlite_classes = ["FreeTierCostLedger"]

[[analytics_engine_datasets]]
binding = "ONHAND_ANALYTICS"
dataset = "onhand_events"

[vars]
# A turn is roughly 3-6 model calls; 80 requests is ~15-25 turns/day.
DAILY_REQUEST_CAP = "80"
# Shared daily hosted-model spend cap. Set higher/lower in production as needed.
DAILY_COST_CAP_USD = "5"
# Reserved before dispatch, reconciled against provider cost. This is an
# estimate, not a guaranteed per-request upper price bound; see admission.md.
# GPT-6 Luna calls average ~$0.0004; a body at the 2.5 MB cap with 16k output
# tokens costs ~$0.14-0.17 at long-context rates. $0.15 covers that while
# letting ~33 requests be in flight under the $5 cap (0.25 allowed 20).
REQUEST_COST_RESERVATION_USD = "0.15"
# Global in-flight requests across all users. A turn runs several model calls
# in sequence, so 4 throttled public traffic with only a few active users.
CONCURRENT_REQUEST_CAP = "20"
DEVICE_CONCURRENT_REQUEST_CAP = "2"
# Stops runaway single turns while still allowing complex pages/PDFs.
TURN_MODEL_CALL_CAP = "50"
# Ops warnings for turns that are unusually expensive or tool-call heavy.
HEAVY_TURN_MODEL_CALLS = "10"
# Warning threshold; independent of the model pricing table.
HEAVY_TURN_COST_USD = "0.01"
HEAVY_TURN_TOKENS = "100000"
# Classrooms and offices share one NAT IP; 5 refused the sixth student of the
# day. Per-device request caps still bound what each registration can spend.
REGISTRATIONS_PER_IP_PER_DAY = "25"
TELEMETRY_EVENTS_PER_IP_PER_DAY = "1000"
ERROR_REPORTS_PER_IP_PER_DAY = "50"

# Secret (never in this file): npx wrangler secret put OPENAI_API_KEY
# Keep OPENROUTER_API_KEY during the seven-day legacy charge-ledger retention.

# Sample runtime diagnostics without logging request bodies in application code.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
